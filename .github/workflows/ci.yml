name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  shellcheck:
    name: Shellcheck (scripts/hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        # Pinned to 2.0.0 — floating @master refs are a supply-chain risk and
        # would be ironic in a repo whose mission is "security by default".
        # Bump by replacing the SHA + comment together.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0
        with:
          scandir: scripts/hooks
          severity: warning

  pytest:
    name: Pytest (plugin integrity + frontmatter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run pytest
        run: pytest tests/ -v

  pytest-windows:
    name: Pytest (Windows / Git Bash)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      # The bash hook scripts only run on Windows via Git Bash (bundled with
      # the runner); the secret-scan tests also need git. Without these the
      # behavioral hook tests silently skip on the maintainer's own platform.
      # Fail if either is absent so a silent skip can't masquerade as a pass.
      - name: Verify bash and git are on PATH
        shell: pwsh
        run: |
          if (-not (Get-Command bash -ErrorAction SilentlyContinue)) { throw "bash not found on Windows runner" }
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) { throw "git not found on Windows runner" }
      - name: Run pytest
        run: pytest tests/ -v

  version-sync:
    name: Version sync (plugin.json == marketplace.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check version sync
        run: python scripts/check_version_sync.py

  codex-agents-parity:
    name: Codex agents TOML matches MD source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check generator parity (gen-codex-agents.py --check)
        run: python scripts/gen-codex-agents.py --check

  codex-plugin-parity:
    name: Codex plugin artifacts match Claude manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check generator parity (gen-codex-plugin.py --check)
        run: python scripts/gen-codex-plugin.py --check
